[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh2u3d"
version = "0.2.1"
description = "Convert 3D meshes to U3D (ECMA-363), HTML 3D (three.js) and PDF with embedded 3D"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "alexcool-project", email = "info@artifix.it" }]
requires-python = ">=3.10"
keywords = ["3d", "u3d", "pdf", "mesh", "cad", "ecma-363", "three.js", "converter", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "numpy>=1.24",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
mesh2u3d = "mesh2u3d.cli:main"

[project.urls]
Homepage = "https://github.com/alexcool-project/mesh2u3d"
Repository = "https://github.com/alexcool-project/mesh2u3d"
Issues = "https://github.com/alexcool-project/mesh2u3d/issues"

# ---------------------------------------------------------------
# SETUPTOOLS: inclusione dei file non-Python (asset JS, immagini)
# ---------------------------------------------------------------
# Queste 3 sezioni sono CRITICHE per il viewer offline: senza di
# esse, gli asset JS (three.min.js, OrbitControls.min.js) non
# vengono copiati dentro il wheel quando il package è installato
# via pip da git (es. su Streamlit Cloud, Vercel, ecc.).

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mesh2u3d*"]
exclude = ["examples*", "tests*", "docs*"]

[tool.setuptools.package-data]
"mesh2u3d.html" = [
    "assets/*.js",
    "assets/*.png",
    "assets/*.svg",
    "assets/*.ico",
]
