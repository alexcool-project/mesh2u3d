[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh2u3d"
version = "0.1.0"
description = "Convert 3D meshes to U3D (ECMA-363) and embed them into PDF files"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "alexcool-project", email = "info@artifix.it" }]
requires-python = ">=3.10"
keywords = ["3d", "u3d", "pdf", "mesh", "cad", "ecma-363"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "numpy>=1.24",
    "pypdf>=4.0",
    "scipy>=1.11",
    "trimesh>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/alexcool-project/mesh2u3d"
Repository = "https://github.com/alexcool-project/mesh2u3d"
Issues = "https://github.com/alexcool-project/mesh2u3d/issues"

[project.scripts]
mesh2u3d = "mesh2u3d.cli:main"

[tool.setuptools.packages.find]
include = ["mesh2u3d*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]